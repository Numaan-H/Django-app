{% extends "itreporting/base.html" %}

{% block title %}Homepage{% endblock %}

{% block content %}
<h1>Log in to view available courses</h1>
<p></p>
<h2><a href="{% url 'itreporting:course_list' %}">Courses</a></h2>

<ul>
    {% for course in courses %}
        <li>
            <a href="{% url 'itreporting:course_detail' course.code %}">
                {{ course.code }} – {{ course.name }}
            </a>            
        </li>
    {% endfor %}
</ul>
{% endblock %}
