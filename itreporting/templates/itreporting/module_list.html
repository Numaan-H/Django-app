{% extends "itreporting/base.html" %}

{% block title %}Modules{% endblock %}

{% block content %}
<h1>Log in to view available modules</h1>

<ul>
    {% for module in modules %}
        <li>
            <a href="{% url 'itreporting:module_detail' module.code %}">
                {{ module.code }} – {{ module.name }}
            </a>            
        </li>
    {% endfor %}
</ul>
{% endblock %}
